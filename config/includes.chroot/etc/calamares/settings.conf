# Djerba OS — séquence Calamares 3.3 (Qt5, Ubuntu 24.04).
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/aarch64-linux-gnu/calamares/modules ]

instances:
    - id: target-cleanup
      module: shellprocess
      config: shellprocess_target-cleanup.conf

sequence:
    - show:
          - welcome
          - locale
          - keyboard
          - partition
          - users
          - summary
    - exec:
          - partition
          - mount
          - unpackfs
          - machineid
          - fstab
          - locale
          - keyboard
          - localecfg
          - users
          - displaymanager
          - networkcfg
          - hwclock
          - services-systemd
          - packages
          - shellprocess@target-cleanup
          - initramfscfg
          - initramfs
          - grubcfg
          - bootloader
          - umount
    - show:
          - finished

branding: djerba

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
