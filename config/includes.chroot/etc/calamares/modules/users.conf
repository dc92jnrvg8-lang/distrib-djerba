# Djerba OS — module « users ».
---
defaultGroups:
    - name: users
      must_exist: true
      system: false
    - adm
    - audio
    - cdrom
    - dip
    - input
    - plugdev
    - render
    - video
    - name: lpadmin
      must_exist: false
      system: true
    - name: gamemode
      must_exist: false
      system: true
    - name: sudo
      must_exist: true
      system: true

autologinGroup: autologin
doAutologin: false

sudoersGroup: sudo
sudoersConfigureWithGroup: false

setRootPassword: false
doReusePassword: true

passwordRequirements:
    minLength: 6
    maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "djerba-${cpu}"
    forbidden_names: [ localhost ]
