# Djerba OS — module « services-systemd ».
---
units:
    - name: "NetworkManager"
      action: "enable"
      mandatory: true
    - name: "sddm"
      action: "enable"
      mandatory: true
    - name: "zramswap"
      action: "enable"
      mandatory: false
    - name: "ufw"
      action: "enable"
      mandatory: false
    - name: "apparmor"
      action: "enable"
      mandatory: false
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
