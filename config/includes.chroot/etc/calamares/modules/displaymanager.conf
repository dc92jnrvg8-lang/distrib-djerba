# Djerba OS — module « displaymanager ».
---
displaymanagers:
    - sddm

defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasmawayland"

basicSetup: false
sysconfigSetup: false

sddm:
    configuration_file: "/etc/sddm.conf"
