# Djerba OS — instance « shellprocess@target-cleanup ».
# Supprime de la cible les fichiers propres à la session live (fournis par
# includes.chroot et donc recopiés par unpackfs).
---
dontChroot: false
timeout: 60
script:
    - "-rm -f /etc/sddm.conf.d/10-wayland-autologin.conf"
    - "-rm -f /etc/sudoers.d/live-user"
    - "-rm -f /etc/polkit-1/rules.d/99-djerba-installer.rules"
    - "-rm -f /etc/xdg/autostart/djerba-welcome.desktop"
    - "-rm -f /usr/share/applications/djerba-install.desktop"
