# SPDX-License-Identifier: GPL-3.0-or-later
# Djerba OS — module « bootloader » (GRUB EFI signé, shim inclus).
#
# Secure Boot : le GRUB signé par Debian (grub-efi-*-signed) cherche sa
# configuration dans /EFI/debian, chemin inscrit dans le binaire signé ;
# l'identifiant EFI doit donc rester « debian ». Le menu GRUB affiche
# « Djerba OS » (GRUB_DISTRIBUTOR, paquet djerba-branding).
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
loaderEntries:
    - "timeout 3"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "debian"
installEFIFallback: true
