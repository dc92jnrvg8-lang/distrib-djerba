# Djerba OS — module « mount » (Calamares 3.3+, schéma mount.schema.yaml).
#
# Depuis Calamares 3.3 les options de montage sont déclarées ICI : le module
# mount les publie dans le GlobalStorage (mountOptionsList) et le module fstab
# les recopie telles quelles dans /etc/fstab de la cible.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd, noatime ]
      ssdOptions: [ ssd, discard=async ]
      hddOptions: [ autodefrag ]
    - filesystem: ext4
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
