# Djerba OS — module « fstab » (Calamares 3.3+, schéma fstab.schema.yaml).
#
# Le module fstab écrit /etc/fstab à partir du GlobalStorage. Les options
# BTRFS appliquées à chaque sous-volume (@ et @home) proviennent de
# mount.conf et donnent sur SSD :
#     subvol=/@,defaults,compress=zstd,noatime,ssd,discard=async
# Ce fichier règle ce qui reste propre au module : /tmp en tmpfs et crypttab.
---
crypttabOptions: luks,keyscript=/bin/cat

tmpOptions:
    default:
        tmpfs: true
        options: "defaults,noatime,nosuid,nodev,mode=1777"
    ssd:
        tmpfs: true
        options: "defaults,noatime,nosuid,nodev,mode=1777"
