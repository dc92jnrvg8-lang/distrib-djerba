# Djerba OS — module « partition ». BTRFS par défaut, swap désactivé
# (la mémoire virtuelle est assurée par zram-tools / zramswap).
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "DJERBA-EFI"

userSwapChoices:
    - none

initialSwapChoice: none

luksGeneration: luks2

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false

initialPartitioningChoice: erase

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

defaultPartitionTableType: gpt
requiredPartitionTableType: gpt

partitionLayout:
    - name: "djerba-root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
