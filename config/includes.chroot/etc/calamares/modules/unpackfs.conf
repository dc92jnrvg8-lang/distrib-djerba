# Djerba OS — module « unpackfs ». Le squashfs est monté par live-boot sous
# /run/live/medium ; il est extrait tel quel sur la racine cible.
---
unpack:
    - source: "/run/live/medium/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""
      exclude:
          - "/run/*"
          - "/tmp/*"
          - "/proc/*"
          - "/sys/*"
          - "/dev/*"
          - "/var/cache/apt/archives/*.deb"
