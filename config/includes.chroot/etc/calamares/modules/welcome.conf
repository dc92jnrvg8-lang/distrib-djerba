# Djerba OS — module « welcome ».
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl: "http://deb.debian.org/debian/"
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
    selector: "time_zone"
