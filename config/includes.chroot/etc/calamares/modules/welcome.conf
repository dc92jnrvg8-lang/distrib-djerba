# Djerba OS — module « welcome ».
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl: "http://connectivity-check.ubuntu.com"
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style: "xml"
    url: "https://geoip.ubuntu.com/lookup"
    selector: "Response/TimeZone"
