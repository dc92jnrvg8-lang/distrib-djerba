[racines]
# Seuls endroits où les outils d'écriture root (os_sys_file_write, os_sys_chown,
# os_sys_chmod) peuvent agir (après résolution des liens symboliques).
ecriture_root = ["/etc", "/usr/local", "/opt", "/srv"]

[plafonds]
# Actions de niveau ≥ 1 par session et par minute.
par_minute = 20
# Actions de niveau ≥ 1 en tout, par fenêtre de dix minutes.
par_dix_minutes = 60
# Même action (outil + paramètres identiques) au plus N fois par heure.
repetitions = 3
