# Djerba OS — politique d'autonomie de l'agent (lue par le démon root djerba-ai-sysd).
#
# Livrée par le paquet djerba-tools, en lecture seule : aucune méthode du démon
# ne l'écrit et son chemin est interdit à tous les outils. Elle est identique
# pour tous les moteurs d'IA (local, Tailscale, Jarvis, API en ligne).
#
# Niveaux (par réversibilité) :
#   0  lecture, diagnostic, recherche : libre
#   1  réversible et local (service, caches, paquet, réglage de l'utilisateur) :
#      autonome, transaction annulable
#   2  système sensible (/etc, noyau, GRUB, pare-feu, pilotes, code déployé) :
#      autonome, transaction + vérification + rollback auto + notification
#   3  irréversible (données de l'utilisateur, instantanés, effacement) :
#      jamais en autonomie ; mode « total » seulement, avec authentification
#
# Outils absents des listes : niveau 0 s'ils lisent, 2 s'ils modifient le
# système en root (règle prudente pour tout nouvel outil root).
version = 1

[niveaux]
# --- niveau 3 : irréversible
secure_delete = 3
os_path_delete = 3
memory_forget = 3
app_delete = 3
snapshot_delete = 3

# --- niveau 2 : système sensible
apt_full_upgrade = 2
apt_autoremove = 2
btrfs_balance = 2
service_disable = 2
os_pkg_purge = 2
os_sys_chmod = 2
os_sys_chown = 2
os_sys_file_write = 2
grub_timeout = 2
grub_update = 2
initramfs_update = 2
hostname_set = 2
sddm_autologin = 2
mac_randomize = 2
mac_restore = 2
ufw_allow_port = 2
ufw_delete_rule = 2
ufw_deny_port = 2
ufw_disable = 2
ufw_enable = 2
anonsurf_start = 2
anonsurf_stop = 2
multilib_enable = 2
swappiness_set = 2
self_update = 2
patch_deploy = 2
patch_rollback = 2
apparmor_load = 2
poweroff = 2
reboot = 2

# --- niveau 1 : réversible et local (root)
apps_install = 1
apps_remove = 1
apps_retry_pending = 1
apt_install = 1
apt_remove = 1
apt_clean = 1
