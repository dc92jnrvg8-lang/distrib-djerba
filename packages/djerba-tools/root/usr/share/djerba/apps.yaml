    selected: false
    preinstalled: false
    apt:
      packages: [kdenlive]

  - id: gimp
    name: GIMP
    category: multimedia
    icon: gimp
    description: Retouche photo et création graphique.
    selected: false
    preinstalled: false
    apt:
