# Djerba OS — durcissement lié à l'agent Djerba.
# Un processus ne peut s'attacher (ptrace) qu'à ses propres descendants : un
# programme quelconque de l'utilisateur ne peut pas détourner l'agent en cours
# d'exécution (seul point d'entrée autorisé à solliciter le démon root).
kernel.yama.ptrace_scope = 1
