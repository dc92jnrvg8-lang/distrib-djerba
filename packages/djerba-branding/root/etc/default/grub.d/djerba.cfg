# Djerba OS — réglages GRUB du système installé (lus après /etc/default/grub).
GRUB_DISTRIBUTOR="Djerba OS"
# Préemption complète du noyau Debian : latence basse pour le jeu et l'audio.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash preempt=full"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_GFXMODE=auto
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_THEME="/usr/share/grub/themes/djerba/theme.txt"
