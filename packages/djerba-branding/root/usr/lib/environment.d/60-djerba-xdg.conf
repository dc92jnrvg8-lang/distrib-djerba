# Djerba OS — identité « À propos de ce système » (kcm-about-distrorc, kickoffrc).
# /etc/xdg/djerba ne contient que des fichiers de configuration KDE : sans effet
# sur les autres bureaux. Complète /etc/xdg/plasma-workspace/env/djerba-xdg.sh
# pour les services de la session lancés par systemd (plasmashell, kinfocenter).
XDG_CONFIG_DIRS=/etc/xdg/djerba:${XDG_CONFIG_DIRS:-/etc/xdg}
